document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"39fa7e37-f806-4774-b7c2-6ef821f4919c\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: italic;\n  font-weight: 300 900;\n  font-display: swap;\n  src: url(\"e2a834c7-a708-4e43-aac8-fcb2aec08fd7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: italic;\n  font-weight: 300 900;\n  font-display: swap;\n  src: url(\"d15c460c-2d35-4719-9493-5ffe4f5097e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 300 900;\n  font-display: swap;\n  src: url(\"e95cdf8c-3f20-45df-a2e0-67d86b4e3f70\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 300 900;\n  font-display: swap;\n  src: url(\"4f18f9c6-5d8d-422a-bc80-b9ccfbc6a866\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{--bg:#faf7f0;--card:#fffdf8;--card2:#f6f0e5;--ink:#2e2a24;--ink2:#5d564b;--muted:#8c8375;--taupe:#b4a59b;--taupe-soft:#efe7dd;--line:#e8dfd0;--orange:#f28a00;--orange-ink:#8a4d00;--orange-soft:#ffefd8;--green:#2f7d63;--green-soft:#e2f0e9;--red:#d1495b;--red-soft:#fbe6e8;--shadow:0 1px 2px rgba(60,46,26,.06),0 8px 24px rgba(60,46,26,.07)}\n[data-theme=\"dark\"]{--bg:#16140f;--card:#211e18;--card2:#1b1913;--ink:#f2ece1;--ink2:#c3bbac;--muted:#948b7c;--taupe:#b4a59b;--taupe-soft:#2c281f;--line:#332e25;--orange:#ff9c1a;--orange-ink:#ffcb85;--orange-soft:#3b2a12;--green:#5fbf9d;--green-soft:#172b24;--red:#f0808d;--red-soft:#331a1d;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}\nbody{margin:0;background:#efe9dd;color:#3a352e;font-family:Figtree,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#a9600b;text-decoration:none}a:hover{color:#f28a00}\n@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}\n@keyframes pop{0%{transform:scale(.82);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}\n@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}\n@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,138,0,.35)}50%{box-shadow:0 0 0 10px rgba(242,138,0,0)}}\n::-webkit-scrollbar{width:0;height:0}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 56px;gap:20px\">\n\n  <div style=\"max-width:560px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n      <h1 style=\"margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#2e2a24\">Fill the Word<\u002Fh1>\n      <span style=\"font-size:12px;font-weight:600;color:#8c8375;letter-spacing:.04em;text-transform:uppercase\">Interactive prototype<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6b6357;text-wrap:pretty\">Drag words from the tray into the dashed blanks. Three hearts per verse — a wrong word bounces back and costs one. Difficulty is two dials: your <strong>tier<\u002Fstrong> (how many blanks + how obscure the verse) and <strong>which word types<\u002Fstrong> get removed. Church orange drives the game layer, taupe the scripture layer. Tap any screen chip below to jump around.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px\">\n    <sc-for list=\"{{ navChips }}\" as=\"c\" hint-placeholder-count=\"7\">\n      <button sc-camel-on-click=\"{{ c.go }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"border:1px solid #d8cfc0;background:#fffdf8;color:#3a352e;font:600 12px Figtree,sans-serif;padding:6px 12px;border-radius:99px;cursor:pointer\">{{ themeLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div ref=\"{{ rootRef }}\" data-theme=\"{{ theme }}\" style=\"width:390px;max-width:100%;height:844px;border-radius:46px;padding:11px;background:linear-gradient(160deg,#3a352e,#1b1814);box-shadow:0 30px 70px rgba(45,35,20,.28),0 2px 0 rgba(255,255,255,.18) inset;flex:none\">\n    <div style=\"position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none\">\n\n      <div style=\"position:relative;z-index:5;flex:none;height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.01em\">\n        <span>9:41<\u002Fspan>\n        <div style=\"display:flex;gap:5px;align-items:center\">\n          <span style=\"width:16px;height:9px;border:1.4px solid var(--ink);border-radius:2.5px;display:block;position:relative;opacity:.85\"><\u002Fspan>\n          <span style=\"width:22px;height:9px;border:1.4px solid var(--ink);border-radius:2.5px;display:block;opacity:.85\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ONBOARDING -->\n      <sc-if value=\"{{ isOnb }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 24px 26px;overflow-y:auto\">\n        <div style=\"display:flex;gap:6px;margin-bottom:26px\">\n          <sc-for list=\"{{ onbDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <span style=\"{{ d.style }}\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ onb0 }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;animation:rise .4s ease both\">\n          <div style=\"width:76px;height:76px;border-radius:24px;background:var(--orange);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(242,138,0,.35)\">\n            <span style=\"width:30px;height:4px;border-radius:2px;background:#fff;box-shadow:0 -11px 0 rgba(255,255,255,.45),0 11px 0 #fff\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <h2 style=\"margin:0;font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.03em;color:var(--ink)\">Learn it by<br>filling it in.<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--ink2);max-width:290px;text-wrap:pretty\">One verse a day, a few words missing. Drag them back where they belong and the verse sticks.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:6px\">\n            <div style=\"display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2)\"><span style=\"width:7px;height:7px;border-radius:99px;background:var(--orange);flex:none\"><\u002Fspan>66 books, four translations<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2)\"><span style=\"width:7px;height:7px;border-radius:99px;background:var(--orange);flex:none\"><\u002Fspan>You choose what gets blanked<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink2)\"><span style=\"width:7px;height:7px;border-radius:99px;background:var(--orange);flex:none\"><\u002Fspan>Streaks, badges, friends<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onbNext }}\" style=\"margin-top:14px;border:0;background:var(--orange);color:#fff;font:800 17px Figtree,sans-serif;padding:17px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(242,138,0,.32)\">Get started<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ onb1 }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;animation:rise .35s ease both\">\n          <div><h2 style=\"margin:0 0 6px;font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Pick your translation<\u002Fh2>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--muted)\">You can switch any time in Settings.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ versionCards }}\" as=\"v\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ v.pick }}\" style=\"{{ v.style }}\">\n                <span style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                  <span style=\"font-size:17px;font-weight:800;letter-spacing:-.01em\">{{ v.abbr }}<\u002Fspan>\n                  <span style=\"{{ v.dot }}\"><\u002Fspan>\n                <\u002Fspan>\n                <span style=\"font-size:13px;color:var(--muted);font-weight:500\">{{ v.name }}<\u002Fspan>\n                <span style=\"font-size:12.5px;color:var(--taupe);font-weight:600;font-style:italic\">{{ v.sample }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onbNext }}\" style=\"margin-top:auto;border:0;background:var(--orange);color:#fff;font:800 17px Figtree,sans-serif;padding:17px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(242,138,0,.32)\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ onb2 }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;animation:rise .35s ease both\">\n          <div><h2 style=\"margin:0 0 6px;font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Set your difficulty<\u002Fh2>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:var(--muted)\">Tier sets how many words go missing and how well-known the verse is.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ tierRows }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.style }}\">\n                <span style=\"{{ t.numStyle }}\">{{ t.num }}<\u002Fspan>\n                <span style=\"display:flex;flex-direction:column;gap:2px;text-align:left;flex:1;min-width:0\">\n                  <span style=\"font-size:15.5px;font-weight:800;letter-spacing:-.01em\">{{ t.name }}<\u002Fspan>\n                  <span style=\"font-size:12.5px;color:var(--muted);font-weight:500\">{{ t.desc }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:2px\">\n            <span style=\"font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)\">Blank out which words?<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ typeChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ finishOnb }}\" style=\"margin-top:auto;border:0;background:var(--orange);color:#fff;font:800 17px Figtree,sans-serif;padding:17px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(242,138,0,.32)\">Start playing<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- HOME -->\n      <sc-if value=\"{{ isHome }}\">\n      <div style=\"flex:1;min-height:0;overflow-y:auto;padding:6px 22px 96px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n          <div style=\"display:flex;flex-direction:column;gap:1px\">\n            <span style=\"font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em\">Tuesday, Sept 8<\u002Fspan>\n            <span style=\"font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">Morning, Grace<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;background:var(--orange-soft);border:1px solid var(--orange);padding:7px 12px;border-radius:99px\">\n            <span style=\"width:9px;height:9px;border-radius:99px;background:var(--orange);animation:glow 2.4s ease-in-out infinite\"><\u002Fspan>\n            <span style=\"font-size:14.5px;font-weight:800;color:var(--orange-ink)\">{{ streak }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:15px;box-shadow:var(--shadow)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n            <span style=\"font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--orange-ink);background:var(--orange-soft);padding:5px 10px;border-radius:6px\">Today's verse<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:700;color:var(--muted)\">{{ version }} · {{ tierName }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:17.5px;line-height:1.75;color:var(--ink);font-weight:500;text-wrap:pretty\">{{ previewA }}<span style=\"display:inline-block;width:64px;border-bottom:2px dashed var(--taupe);vertical-align:-2px;margin:0 3px\"><\u002Fspan>{{ previewB }}<span style=\"display:inline-block;width:52px;border-bottom:2px dashed var(--taupe);vertical-align:-2px;margin:0 3px\"><\u002Fspan>{{ previewC }}<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"width:24px;height:1px;background:var(--line)\"><\u002Fspan>\n            <span style=\"font-size:13px;font-weight:700;color:var(--taupe);letter-spacing:.02em\">{{ todayRef }}<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ startGame }}\" style=\"border:0;background:var(--orange);color:#fff;font:800 16.5px Figtree,sans-serif;padding:16px;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px rgba(242,138,0,.3)\">Play today's verse<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n          <sc-for list=\"{{ homeStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:3px\">\n              <span style=\"font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink)\">{{ s.value }}<\u002Fspan>\n              <span style= 02Fspan>\n                <button sc-camel-on-click=\"{{ r.toggle }}\" style=\"{{ r.trackStyle }}\"><span style=\"{{ r.knobStyle }}\"><\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- TAB BAR -->\n      <sc-if value=\"{{ showTabs }}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;padding:8px 18px 22px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:4px\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">\n            <span style=\"{{ t.dotStyle }}\"><\u002Fspan>{{ t.label }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- COMPLETE OVERLAY -->\n      <sc-if value=\"{{ showComplete }}\">\n      <div style=\"position:absolute;inset:0;background:rgba(20,15,6,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:32px;z-index:20\">\n        <div style=\"background:var(--card);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;animation:pop .4s cubic-bezier(.34,1.4,.5,1) both;box-shadow:0 20px 50px rgba(0,0,0,.3)\">\n          <div style=\"{{ resIconStyle }}\"><\u002Fdiv>\n          <span style=\"font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-align:center\">{{ resTitle }}<\u002Fspan>\n          <span style=\"font-size:14px;font-weight:600;color:var(--muted);text-align:center;line-height:1.5\">{{ resSub }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ goResults }}\" style=\"width:100%;border:0;background:var(--orange);color:#fff;font:800 16px Figtree,sans-serif;padding:15px;border-radius:14px;cursor:pointer;margin-top:4px\">See results<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- SHARE SHEET -->\n      <sc-if value=\"{{ showShare }}\">\n      <div sc-camel-on-click=\"{{ closeShare }}\" style=\"position:absolute;inset:0;background:rgba(20,15,6,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;z-index:25\">\n        <div style=\"width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 22px 30px;display:flex;flex-direction:column;gap:16px;animation:rise .3s ease both\">\n          <span style=\"width:38px;height:4px;border-radius:99px;background:var(--line);align-self:center\"><\u002Fspan>\n          <div style=\"background:linear-gradient(155deg,#f28a00,#c96f00);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;color:#fff\">\n            <span style=\"font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85\">Fill the Word<\u002Fspan>\n            <span style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15\">{{ todayRef }} — {{ shareAcc }}<\u002Fspan>\n            <div style=\"display:flex;gap:18px\">\n              <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:20px;font-weight:800\">{{ streak }}<\u002Fspan><span style=\"font-size:11px;font-weight:700;opacity:.85\">day streak<\u002Fspan><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:20px;font-weight:800\">{{ shareTime }}<\u002Fspan><span style=\"font-size:11px;font-weight:700;opacity:.85\">seconds<\u002Fspan><\u002Fspan>\n              <span style=\"display:flex;flex-direction:column\"><span style=\"font-size:20px;font-weight:800\">{{ tierName }}<\u002Fspan><span style=\"font-size:11px;font-weight:700;opacity:.85\">tier<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeShare }}\" style=\"border:0;background:var(--orange);color:#fff;font:800 16px Figtree,sans-serif;padding:15px;border-radius:14px;cursor:pointer\">Share to friends<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ dragging }}\">\n    <span style=\"{{ ghostStyle }}\">{{ ghostText }}<\u002Fspan>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:1080},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f28a00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#f28a00&quot;,&quot;#c8853f&quot;,&quot;#2f7d63&quot;,&quot;#4a5fd4&quot;],&quot;section&quot;:&quot;Brand&quot;},&quot;heartsPerVerse&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Gameplay&quot;}}\">\nclass Component extends DCLogic {\n  books = {\n    ot: [\"Genesis\",\"Exodus\",\"Leviticus\",\"Numbers\",\"Deuteronomy\",\"Joshua\",\"Judges\",\"Ruth\",\"1 Samuel\",\"2 Samuel\",\"1 Kings\",\"2 Kings\",\"1 Chronicles\",\"2 Chronicles\",\"Ezra\",\"Nehemiah\",\"Esther\",\"Job\",\"Psalms\",\"Proverbs\",\"Ecclesiastes\",\"Song of Solomon\",\"Isaiah\",\"Jeremiah\",\"Lamentations\",\"Ezekiel\",\"Daniel\",\"Hosea\",\"Joel\",\"Amos\",\"Obadiah\",\"Jonah\",\"Micah\",\"Nahum\",\"Habakkuk\",\"Zephaniah\",\"Haggai\",\"Zechariah\",\"Malachi\"],\n    nt: [\"Matthew\",\"Mark\",\"Luke\",\"John\",\"Acts\",\"Romans\",\"1 Corinthians\",\"2 Corinthians\",\"Galatians\",\"Ephesians\",\"Philippians\",\"Colossians\",\"1 Thessalonians\",\"2 Thessalonians\",\"1 Timothy\",\"2 Timothy\",\"Titus\",\"Philemon\",\"Hebrews\",\"James\",\"1 Peter\",\"2 Peter\",\"1 John\",\"2 John\",\"3 John\",\"Jude\",\"Revelation\"]\n  };\n\n  tiers = [\n    {name:\"Novice\", n:1, pop:1, desc:\"1 blank · the verses everyone knows\"},\n    {name:\"Apprentice\", n:2, pop:1, desc:\"2 blanks · still very familiar ground\"},\n    {name:\"Disciple\", n:3, pop:2, desc:\"3 blanks · widens past the greatest hits\"},\n    {name:\"Teacher\", n:5, pop:3, desc:\"5 blanks · longer verses, closer distractors\"},\n    {name:\"Scholar\", n:7, pop:4, desc:\"7 blanks · obscure passages, book & reference hidden\"}\n  ];\n\n  versions = [\n    {abbr:\"KJV\", name:\"King James Version\", sample:\"“For God so loved the world…”\"},\n    {abbr:\"NKJV\", name:\"New King James Version\", sample:\"“For God so loved the world…”\"},\n    {abbr:\"NIV\", name:\"New International Version\", sample:\"“For God so loved the world…”\"},\n    {abbr:\"NLT\", name:\"New Living Translation\", sample:\"“For God loved the world so much…”\"}\n  ];\n\n  verses = [\n    {book:\"John\", cv:\"3:16\", pop:1, text:{\n      KJV:\"For God~name so loved~verb the world,~noun that he gave~verb his only begotten Son,~name that whosoever believeth~verb in him should not perish,~verb but have everlasting life.~noun\",\n      NKJV:\"For God~name so loved~verb the world~noun that He gave~verb His only begotten Son,~name that whoever believes~verb in Him should not perish~verb but have everlasting life.~noun\",\n      NIV:\"For God~name so loved~verb the world~noun that he gave~verb his one and only Son,~name that whoever believes~verb in him shall not perish~verb but have eternal life.~noun\",\n      NLT:\"For this is how God~name loved~verb the world:~noun He gave~verb his one and only Son,~name so that everyone who believes~verb in him will not perish~verb but have eternal life.~noun\"}},\n    {book:\"Psalms\", cv:\"23:1\", pop:1, text:{\n      KJV:\"The LORD~name is my shepherd;~noun I shall not want.~verb\"}},\n    {book:\"Philippians\", cv:\"4:13\", pop:1, text:{\n      KJV:\"I can do~verb all things through Christ~name which strengtheneth~verb me.\",\n      NKJV:\"I can do~verb all things through Christ~name who strengthens~verb me.\",\n      NIV:\"I can do~verb all this through him who gives~verb me strength.~noun\",\n      NLT:\"For I can do~verb everything through Christ,~name who gives~verb me strength.~noun\"}},\n    {book:\"Proverbs\", cv:\"3:5\", pop:2, text:{\n      KJV:\"Trust~verb in the LORD~name with all thine heart;~noun and lean~verb not unto thine own understanding.~noun\"}},\n    {book:\"Joshua\", cv:\"1:9\", pop:2, text:{\n      KJV:\"Be strong and of a good courage;~noun be not afraid, neither be thou dismayed:~verb for the LORD~name thy God~name is with thee whithersoever thou goest.~verb\"}},\n    {book:\"Isaiah\", cv:\"40:31\", pop:3, text:{\n      KJV:\"But they that wait~verb upon the LORD~name shall renew~verb their strength;~noun they shall mount~verb up with wings~noun as eagles;~noun they shall run,~verb and not be weary.~verb\"}},\n    {book:\"Habakkuk\", cv:\"3:19\", pop:4, text:{\n      KJV:\"The LORD~name God~name is my strength,~noun and he will make~verb my feet like hinds' feet,~noun and he will make~verb me to walk~verb upon mine high places.~noun\"}}\n  ];\n\n  pools = {\n    name: [\"Christ\",\"Moses\",\"David\",\"Spirit\",\"LORD\",\"Paul\",\"Israel\",\"Jesus\",\"God\"],\n    verb: [\"walked\",\"spake\",\"called\",\"kept\",\"believed\",\"gave\",\"sent\",\"made\",\"waited\",\"renew\",\"trust\"],\n    noun: [\"heart\",\"light\",\"truth\",\"kingdom\",\"earth\",\"spirit\",\"water\",\"word\",\"strength\",\"world\",\"life\"],\n    book: [\"Romans\",\"Matthew\",\"Psalms\",\"Isaiah\",\"Luke\",\"Acts\",\"Hebrews\",\"John\"],\n    reference: [\"3:15\",\"4:16\",\"1:1\",\"2:16\",\"23:1\",\"40:31\"]\n  };\n\n  typeMeta = [\n    {key:\"name\", label:\"Names\", hint:\"God, Christ, David, Israel\"},\n    {key:\"verb\", label:\"Verbs\", hint:\"loved, gave, believeth\"},\n    {key:\"noun\", label:\"Nouns\", hint:\"world, heart, strength\"},\n    {key:\"book\", label:\"Book of the Bible\", hint:\"Blanks the book in the reference\"},\n    {key:\"reference\", label:\"Chapter & verse\", hint:\"Blanks the numbers in the reference\"}\n  ];\n\n  state = {\n    screen: \"onboarding\", onb: 0, theme: \"light\", themeMode: \"system\",\n    version: \"KJV\", tier: 2,\n    types: {name:true, verb:true, noun:true, book:false, reference:false},\n    extras: {audio:true, reverse:false, refOnly:false, reminders:true},\n    game: null, drag: null, hover: null, shake: null, selected: null,\n    complete: false, share: false, query: \"\", testament: \"All\",\n    streak: 12, xp: 1840, round: 0, results: null, audioOn: false\n  };\n\n  rootRef = React.createRef();\n\n  componentDidMount() {\n    const mq = window.matchMedia(\"(prefers-color-scheme: dark)\");\n    this.setState({theme: mq.matches ? \"dark\" : \"light\"});\n    this._mq = mq;\n    this._mqh = e => { if (this.state.themeMode === \"system\") this.setState({theme: e.matches ? \"dark\" : \"light\"}); };\n    mq.addEventListener(\"change\", this._mqh);\n    this._move = e => this.onMove(e);\n    this._up = e => this.onUp(e);\n    window.addEventListener(\"pointermove\", this._move, {passive:false});\n    window.addEventListener(\"pointerup\", this._up);\n    this._tick = setInterval(() => {\n      const g = this.state.game;\n      if (this.state.screen !== \"game\" || !g || this.state.complete) return;\n      this.setState(s => ({game: {...s.game, elapsed: Math.floor((Date.now() - s.game.start)/1000)}}));\n    }, 400);\n    this.applyAccent();\n  }\n  componentDidUpdate() { this.applyAccent(); }\n  componentWillUnmount() {\n    clearInterval(this._tick);\n    window.removeEventListener(\"pointermove\", this._move);\n    window.removeEventListener(\"pointerup\", this._up);\n    if (this._mq) this._mq.removeEventListener(\"change\", this._mqh);\n  }\n  applyAccent() {\n    const el = this.rootRef.current;\n    const a = this.props.accent;\n    if (el && a) el.style.setProperty(\"--orange\", a);\n  }\n\n  // ---------- verse building ----------\n  parse(raw) {\n    return raw.split(/\\s+/).filter(Boolean).map((tok, i) => {\n      let type = null, t = tok;\n      const m = t.match(/~(name|verb|noun)$/);\n      if (m) { type = m[1]; t = t.slice(0, -m[0].length); }\n      const pm = t.match(/[.,;:!?'\"”’]+$/);\n      const punct = pm ? pm[0] : \"\";\n      const word = pm ? t.slice(0, -pm[0].length) : t;\n      return {i, word, punct, type, text: t};\n    });\n  }\n\n  shuffle(a) { const r = a.slice(); for (let i = r.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }\n\n  buildGame() {\n    const tier = this.tiers[this.state.tier];\n    const pool = this.verses.filter(v => v.pop <= tier.pop);\n    const verse = pool[this.state.round % pool.length] || this.verses[0];\n    const raw = verse.text[this.state.version] || verse.text.KJV;\n    const tokens = this.parse(raw);\n    const types = this.state.types;\n\n    let candidates = tokens.filter(t => t.type && types[t.type]);\n    if (!candidates.length) candidates = tokens.filter(t => t.word.length > 3);\n    const n = Math.min(tier.n, candidates.length);\n    const chosen = this.shuffle(candidates).slice(0, n).sort((a,b) => a.i - b.i);\n    const chosenIdx = new Set(chosen.map(t => t.i));\n\n    const parts = tokens.map(t =>\n      chosenIdx.has(t.i)\n        ? {kind:\"blank\", id:\"b\"+t.i, word:t.word, punct:t.punct, type:t.type}\n        : {kind:\"word\", text:t.text}\n    );\n\n    const refBlanks = [];\n    if (types.book) refBlanks.push({id:\"rb\", word:verse.book, type:\"book\"});\n    if (types.reference) refBlanks.push({id:\"rc\", word:verse.cv, type:\"reference\"});\n\n    const answers = parts.filter(p => p.kind === \"blank\").concat(refBlanks);\n    const used = new Set(answers.map(a => a.word.toLowerCase()));\n    const extras = [];\n    const wantExtras = Math.min(4, 2 + this.state.tier);\n    const kinds = answers.map(a => a.type || \"noun\");\n    let guard = 0;\n    while (extras.length < wantExtras && guard++ < 80) {\n      const k = kinds[Math.floor(Math.random()*kinds.length)] || \"noun\";\n      const p = this.pools[k] || this.pools.noun;\n      const w = p[Math.floor(Math.ra e.clientX, e.clientY);\n    this.setState({drag:{...d, x:e.clientX, y:e.clientY}, hover});\n  }\n  onUp(e) {\n    const d = this.state.drag;\n    if (!d) return;\n    const hover = this.hitTest(e.clientX, e.clientY);\n    if (!this._moved) { this.setState({drag:null, hover:null, selected: this.state.selected === d.key ? null : d.key}); return; }\n    this.setState({drag:null, hover:null});\n    if (hover) this.attempt(d.key, d.text, hover);\n  }\n  onTapBlank(id) {\n    const sel = this.state.selected;\n    if (!sel) return;\n    const w = this.state.game.bank.find(b => b.key === sel);\n    if (w) { this.setState({selected:null}); this.attempt(w.key, w.text, id); }\n  }\n\n  attempt(key, text, blankId) {\n    const g = this.state.game;\n    if (!g || g.placed[blankId]) return;\n    const target = this.blankById(blankId);\n    if (!target) return;\n    if (text.toLowerCase() === target.word.toLowerCase()) {\n      const placed = {...g.placed, [blankId]: text};\n      const bank = g.bank.filter(b => b.key !== key);\n      const done = Object.keys(placed).length >= g.total;\n      this.setState({game:{...g, placed, bank}}, () => { if (done) this.finish(true); });\n    } else {\n      const hearts = g.hearts - 1;\n      this.setState({game:{...g, hearts, wrong: g.wrong + 1}, shake: blankId});\n      setTimeout(() => this.setState({shake:null}), 480);\n      if (hearts <= 0) {\n        const placed = {...g.placed};\n        this.allBlanks().forEach(b => { if (!placed[b.id]) placed[b.id] = b.word; });\n        setTimeout(() => this.setState(s => ({game:{...s.game, placed, hearts:0}}), () => this.finish(false)), 520);\n      }\n    }\n  }\n\n  finish(won) {\n    const g = this.state.game;\n    const attempts = g.total + g.wrong;\n    const acc = Math.round((g.total / Math.max(1, attempts)) * 100);\n    const time = Math.max(1, Math.floor((Date.now() - g.start)/1000));\n    const speed = Math.max(0, 60 - time);\n    const xp = won ? 40 + (this.state.tier * 15) + speed - (g. nge-ink)\" : \"var(--muted)\"}`\n      })),\n      bookList,\n\n      tabs: tabDefs.map(([k, label]) => {\n        const on = s.screen === k;\n        return {label, go: go(k),\n          style: `flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border:0;background:transparent;cursor:pointer;font:700 10.5px Figtree,sans-serif;color:${on ? \"var(--orange-ink)\" : \"var(--muted)\"}`,\n          dotStyle: `width:20px;height:20px;border-radius:7px;display:block;background:${on ? orange : \"var(--taupe-soft)\"};transition:background .2s`};\n      })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
